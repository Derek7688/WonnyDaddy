const coreData = [{"num": "01", "coreNum": 1, "coreKr": "회의를 시작하겠습니다.", "coreEn": "Let's get started.", "kr": "회의를 시작하겠습니다.", "en": "Let's get started."}, {"num": "02", "coreNum": 2, "coreKr": "오늘 회의에 참석해 주셔서 감사합니다.", "coreEn": "Thanks for joining today's meeting.", "kr": "오늘 회의에 참석해 주셔서 감사합니다.", "en": "Thanks for joining today's meeting."}, {"num": "03", "coreNum": 3, "coreKr": "모두 시간 내주셔서 감사합니다.", "coreEn": "I appreciate everyone making time for this.", "kr": "모두 시간 내주셔서 감사합니다.", "en": "I appreciate everyone making time for this."}, {"num": "04", "coreNum": 4, "coreKr": "오늘 회의의 목적은 출시 계획을 검토하는 것입니다.", "coreEn": "The purpose of today's meeting is to review the launch plan.", "kr": "오늘 회의의 목적은 출시 계획을 검토하는 것입니다.", "en": "The purpose of today's meeting is to review the launch plan."}, {"num": "05", "coreNum": 5, "coreKr": "오늘 안건은 세 가지입니다.", "coreEn": "We have three items on the agenda.", "kr": "오늘 안건은 세 가지입니다.", "en": "We have three items on the agenda."}, {"num": "06", "coreNum": 6, "coreKr": "먼저 영업 현황 보고를 살펴보겠습니다.", "coreEn": "First, let's go over the sales update.", "kr": "먼저 영업 현황 보고를 살펴보겠습니다.", "en": "First, let's go over the sales update."}, {"num": "07", "coreNum": 7, "coreKr": "그다음에는 예산에 대해 논의하겠습니다.", "coreEn": "After that, we'll discuss the budget.", "kr": "그다음에는 예산에 대해 논의하겠습니다.", "en": "After that, we'll discuss the budget."}, {"num": "08", "coreNum": 8, "coreKr": "질문은 마지막에 받겠습니다.", "coreEn": "We'll save questions for the end.", "kr": "질문은 마지막에 받겠습니다.", "en": "We'll save questions for the end."}, {"num": "09", "coreNum": 9, "coreKr": "오늘의 주요 주제를 소개하겠습니다.", "coreEn": "I'd like to introduce today's main topic.", "kr": "오늘의 주요 주제를 소개하겠습니다.", "en": "I'd like to introduce today's main topic."}, {"num": "10", "coreNum": 10, "coreKr": "시작하기 전에 누가 참석했는지 확인하겠습니다.", "coreEn": "Before we begin, let me check who's attending.", "kr": "시작하기 전에 누가 참석했는지 확인하겠습니다.", "en": "Before we begin, let me check who's attending."}, {"num": "11", "coreNum": 11, "coreKr": "모두 참석하셨나요?", "coreEn": "Is everyone here?", "kr": "모두 참석하셨나요?", "en": "Is everyone here?"}, {"num": "12", "coreNum": 12, "coreKr": "두 분이 아직 안 오신 것 같네요.", "coreEn": "It looks like we're missing two people.", "kr": "두 분이 아직 안 오신 것 같네요.", "en": "It looks like we're missing two people."}, {"num": "13", "coreNum": 13, "coreKr": "그분들이 올 때까지 1분만 더 기다리죠.", "coreEn": "Let's give them another minute.", "kr": "그분들이 올 때까지 1분만 더 기다리죠.", "en": "Let's give them another minute."}, {"num": "14", "coreNum": 14, "coreKr": "그분들 없이 시작해도 되겠습니다.", "coreEn": "We can start without them.", "kr": "그분들 없이 시작해도 되겠습니다.", "en": "We can start without them."}, {"num": "15", "coreNum": 15, "coreKr": "회의가 예정대로 진행되도록 하겠습니다.", "coreEn": "I'll keep the meeting on schedule.", "kr": "회의가 예정대로 진행되도록 하겠습니다.", "en": "I'll keep the meeting on schedule."}, {"num": "16", "coreNum": 16, "coreKr": "이번 회의에는 30분이 주어져 있습니다.", "coreEn": "We have 30 minutes for this meeting.", "kr": "이번 회의에는 30분이 주어져 있습니다.", "en": "We have 30 minutes for this meeting."}, {"num": "17", "coreNum": 17, "coreKr": "우리의 주요 목표는 다음 단계를 합의하는 것입니다.", "coreEn": "Our main objective is to agree on the next steps.", "kr": "우리의 주요 목표는 다음 단계를 합의하는 것입니다.", "en": "Our main objective is to agree on the next steps."}, {"num": "18", "coreNum": 18, "coreKr": "어떻게 진행할지 개요를 설명하겠습니다.", "coreEn": "I'd like to outline how we'll proceed.", "kr": "어떻게 진행할지 개요를 설명하겠습니다.", "en": "I'd like to outline how we'll proceed."}, {"num": "19", "coreNum": 19, "coreKr": "먼저 핵심 사항을 다루겠습니다.", "coreEn": "We'll cover the key points first.", "kr": "먼저 핵심 사항을 다루겠습니다.", "en": "We'll cover the key points first."}, {"num": "20", "coreNum": 20, "coreKr": "질문이 있으시면 말씀해 주세요.", "coreEn": "Please let me know if you have any questions.", "kr": "질문이 있으시면 말씀해 주세요.", "en": "Please let me know if you have any questions."}, {"num": "21", "coreNum": 21, "coreKr": "언제든 편하게 의견을 말씀해 주세요.", "coreEn": "Feel free to jump in at any time.", "kr": "언제든 편하게 의견을 말씀해 주세요.", "en": "Feel free to jump in at any time."}, {"num": "22", "coreNum": 22, "coreKr": "발언은 간단히 해 주세요.", "coreEn": "Let's keep our comments brief.", "kr": "발언은 간단히 해 주세요.", "en": "Let's keep our comments brief."}, {"num": "23", "coreNum": 23, "coreKr": "그 내용은 나중에 더 자세히 논의할 수 있습니다.", "coreEn": "We can discuss that in more detail later.", "kr": "그 내용은 나중에 더 자세히 논의할 수 있습니다.", "en": "We can discuss that in more detail later."}, {"num": "24", "coreNum": 24, "coreKr": "우리 모두 같은 내용을 이해하고 있는지 확인하고 싶습니다.", "coreEn": "I'd like to make sure we're all on the same page.", "kr": "우리 모두 같은 내용을 이해하고 있는지 확인하고 싶습니다.", "en": "I'd like to make sure we're all on the same page."}, {"num": "25", "coreNum": 25, "coreKr": "다음으로 넘어가기 전에 덧붙이실 내용이 있나요?", "coreEn": "Does anyone have anything to add before we move on?", "kr": "다음으로 넘어가기 전에 덧붙이실 내용이 있나요?", "en": "Does anyone have anything to add before we move on?"}, {"num": "26", "coreNum": 26, "coreKr": "다른 의견이 없으면 다음으로 넘어가겠습니다.", "coreEn": "If there are no other comments, let's move on.", "kr": "다른 의견이 없으면 다음으로 넘어가겠습니다.", "en": "If there are no other comments, let's move on."}, {"num": "27", "coreNum": 27, "coreKr": "첫 번째 안건부터 시작하겠습니다.", "coreEn": "Let's start with the first item.", "kr": "첫 번째 안건부터 시작하겠습니다.", "en": "Let's start with the first item."}, {"num": "28", "coreNum": 28, "coreKr": "진행하면서 회의 내용을 기록하겠습니다.", "coreEn": "I'll take notes as we go.", "kr": "진행하면서 회의 내용을 기록하겠습니다.", "en": "I'll take notes as we go."}, {"num": "29", "coreNum": 29, "coreKr": "마지막에 간단히 요약할 시간을 남겨두겠습니다.", "coreEn": "We'll leave time at the end for a quick recap.", "kr": "마지막에 간단히 요약할 시간을 남겨두겠습니다.", "en": "We'll leave time at the end for a quick recap."}, {"num": "30", "coreNum": 30, "coreKr": "간단한 개요부터 시작하겠습니다.", "coreEn": "Let's begin with a quick overview.", "kr": "간단한 개요부터 시작하겠습니다.", "en": "Let's begin with a quick overview."}];

let orderMode='ordered', studySequence=[], currentIdx=0, isRevealed=false, isAutoMode=false, autoGaugeTimer=null;
const KR_THINK_TIME=5000, EN_CONFIRM_TIME=2500;
const bannerMsgs=[
  {icon:'⚡',title:'입에서 3초 만에 툭! 실전 회화 치트키',sub:'워니아빠 인스타에서 하루 1분 꿀팁 모아보기 →',url:'https://www.instagram.com/wonnydaddy_english/'},
  {icon:'🎬',title:'교과서엔 없는 100% 찐 미국식 뉘앙스',sub:'워니아빠 유튜브에서 상황별 실전 영상 보기 →',url:'https://www.youtube.com/@%EC%9B%8C%EB%8B%88%EC%95%84%EB%B9%A0_Official'}
];
let currentBannerIdx=0;
function handleBannerClick(){const item=bannerMsgs[currentBannerIdx];if(item&&item.url)window.open(item.url,'_blank','noopener,noreferrer');}
function injectBanners(){const t=document.getElementById('banner-template').content;['setup-banner-area','study-banner-area','finish-banner-area'].forEach(id=>{const a=document.getElementById(id);if(a)a.appendChild(t.cloneNode(true));});}
function rotateBanners(){currentBannerIdx=(currentBannerIdx+1)%bannerMsgs.length;const m=bannerMsgs[currentBannerIdx];document.querySelectorAll('.promo-banner').forEach(b=>{const i=b.querySelector('.banner-inner');if(!i)return;i.style.opacity=0;i.style.transform='translateY(3px)';setTimeout(()=>{b.querySelector('.banner-icon').innerText=m.icon;b.querySelector('.banner-title').innerText=m.title;b.querySelector('.banner-sub').innerText=m.sub;i.style.opacity=1;i.style.transform='translateY(0)';},500);});}
function selectOrderMode(m){orderMode=m;updateSelections();}
function updateSelections(){[['ordered','tab-ordered',orderMode],['random','tab-random',orderMode]].forEach(([value,id,selected])=>{document.getElementById(id).className=value===selected?'py-3 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm':'py-3 rounded-xl font-bold text-xs text-slate-500 transition-all';});document.getElementById('mode-desc').innerText=`핵심 문장 30개를 ${orderMode==='ordered'?'순서대로':'중복 없이 랜덤으로'} 연습합니다.`;}
function toggleAutoMode(){isAutoMode=!isAutoMode;const b=document.getElementById('auto-mode-btn');b.innerHTML=isAutoMode?'🟠 자동 재생 ON':'⚪ 자동 재생 OFF';b.className=`w-full py-4 rounded-2xl border-2 font-bold flex items-center justify-center gap-2 transition-all ${isAutoMode?'auto-active':'border-slate-100 text-slate-600'}`;}
function switchModeInGame(){isAutoMode=!isAutoMode;updateInGameModeUI();if(isAutoMode)runAutoGauge(isRevealed?EN_CONFIRM_TIME:KR_THINK_TIME);else stopAutoGauge();}
function updateInGameModeUI(){const s=document.getElementById('mode-status'),b=document.getElementById('mode-switch-btn');s.innerText=isAutoMode?'자동':'수동';s.className=isAutoMode?'text-[9px] font-black px-2 py-0.5 rounded-full bg-orange-100 text-orange-600':'text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-50 text-slate-300';b.innerText=isAutoMode?'수동 전환':'자동 전환';}
function runAutoGauge(duration){stopAutoGauge();if(!isAutoMode)return;const c=document.getElementById('timer-gauge-container'),bar=document.getElementById('timer-gauge-bar');c.classList.remove('hidden');bar.style.transition='none';bar.style.width='100%';const start=Date.now();requestAnimationFrame(()=>bar.style.transition='width 50ms linear');autoGaugeTimer=setInterval(()=>{const left=Math.max(0,duration-(Date.now()-start));bar.style.width=`${left/duration*100}%`;if(left<=0){stopAutoGauge();handleAction();}},50);}
function stopAutoGauge(){if(autoGaugeTimer){clearInterval(autoGaugeTimer);autoGaugeTimer=null;}const c=document.getElementById('timer-gauge-container'),b=document.getElementById('timer-gauge-bar');if(c)c.classList.add('hidden');if(b)b.style.width='100%';}
function shuffleArray(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function startStudy(){const source=coreData;studySequence=orderMode==='random'?shuffleArray(source):[...source];currentIdx=0;document.getElementById('badge-playmode').innerText=`핵심 · ${orderMode==='ordered'?'순서':'랜덤'}`;document.getElementById('setup-screen').classList.add('hidden');document.getElementById('study-screen').classList.remove('hidden');initProgressControl();updateInGameModeUI();render();}
function render(){stopAutoGauge();const item=studySequence[currentIdx];const pb=document.getElementById('prev-item-box');if(currentIdx>0){const p=studySequence[currentIdx-1];document.getElementById('prev-kr').innerText='직전: '+p.kr;document.getElementById('prev-en').innerText=p.en;pb.classList.remove('opacity-0');pb.classList.add('opacity-40');}else{pb.classList.add('opacity-0');pb.classList.remove('opacity-40');}document.getElementById('sentence-number').innerText=`${item.num} · ${currentIdx+1}/${studySequence.length}`;const coreRef=document.getElementById('core-reference');coreRef.classList.add('hidden');document.getElementById('kr-box').innerText=item.kr;document.getElementById('en-text').innerText=item.en;document.getElementById('progress-text').innerText=`Step ${currentIdx+1} / ${studySequence.length}`;document.getElementById('progress-bar').style.width=`${studySequence.length<=1?100:currentIdx/(studySequence.length-1)*100}%`;document.getElementById('en-box').className='answer-hidden transition-all duration-500 w-full text-center';document.getElementById('main-btn').innerText='정답 확인';setHideButtonState(false);isRevealed=false;const prev=document.getElementById('prev-btn');prev.classList.toggle('text-slate-300',currentIdx===0);prev.classList.toggle('text-slate-500',currentIdx>0);prev.classList.toggle('opacity-40',currentIdx===0);prev.classList.toggle('pointer-events-none',currentIdx===0);if(isAutoMode)runAutoGauge(KR_THINK_TIME);}
function handleAction(){stopAutoGauge();if(!isRevealed){document.getElementById('en-box').className='answer-visible transition-all duration-500 w-full text-center';document.getElementById('main-btn').innerText='다음 문제';setHideButtonState(true);isRevealed=true;if(isAutoMode)runAutoGauge(EN_CONFIRM_TIME);}else{currentIdx++;if(currentIdx<studySequence.length)render();else finishStudy();}}
function setHideButtonState(available){const b=document.getElementById('hide-answer-btn');b.classList.toggle('is-available',available);b.classList.toggle('is-unavailable',!available);b.setAttribute('aria-disabled',String(!available));}
function hideAnswer(){if(!isRevealed)return;stopAutoGauge();document.getElementById('en-box').className='answer-hidden transition-all duration-500 w-full text-center';document.getElementById('main-btn').innerText='정답 확인';setHideButtonState(false);isRevealed=false;if(isAutoMode)runAutoGauge(KR_THINK_TIME);}
function prevStep(){if(currentIdx>0){currentIdx--;render();}}
function initProgressControl(){const c=document.getElementById('progress-container');const seek=e=>{const r=c.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const p=Math.max(0,Math.min(1,x/r.width)),n=Math.round(p*(studySequence.length-1));if(n!==currentIdx){currentIdx=n;render();}};c.onmousedown=e=>{seek(e);const move=m=>seek(m),up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);};c.ontouchstart=e=>{seek(e);const move=m=>{m.preventDefault();seek(m);},up=()=>{document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);};document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);};}
function finishStudy(){stopAutoGauge();document.getElementById('finish-ui').classList.remove('hidden');document.getElementById('prev-item-box').classList.add('hidden');document.getElementById('study-banner-area').style.display='none';document.getElementById('control-panel').style.display='none';document.getElementById('finish-summary').innerText=`${studySequence.length}개 드릴을 모두 마쳤습니다. 수고하셨습니다!`;document.getElementById('cal-confirm-btn').onclick=()=>{const days=prompt('며칠 뒤에 복습 알림을 예약할까요? (1~30)','1');if(!days)return;const n=Math.max(1,Math.min(30,parseInt(days)||1)),d=new Date();d.setDate(d.getDate()+n);const date=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');const title=encodeURIComponent(`[복습] Wonny Pop! Business English Lesson 01 · 영어로 회의 진행하기 (${orderMode==='ordered'?'순서':'랜덤'} 모드)`);const details=encodeURIComponent(`Wonny Pop! Business English Lesson 01 핵심 문장 드릴링 복습하기!\n\n🔗 주소: ${location.href}`);location.href=`https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${date}T090000/${date}T100000`;};}
window.onload=()=>{injectBanners();setInterval(rotateBanners,4000);};
</script>
</body></html>
